[project]
name = "cerno"
version = "0.1.0"
description = "Evidence-first verification agent for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-python>=0.23",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
cerno = "cerno.cli:app"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cerno"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["examples", "ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
